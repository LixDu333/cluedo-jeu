<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cluedo – Game Master</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

<h1>Cluedo – Game Master</h1>

<button id="restartBtn">🔄 Restart game</button>
<button id="skipTurnBtn">Pass current turn</button>
<button id="validateBtn">✔ Validate answer</button>




<div id="game-container">
  <div id="players-list">
    <h3>Players</h3>
    <ul id="players-ui"></ul>
    <hr>
    <p><strong>Killer:</strong> <span id="killer-name"></span></p>
  </div>

  <div id="game-area">
    <p id="result"></p>
    <div id="board"></div>
  </div>
</div>

<script src="master.js"></script>
</body>
</html>
